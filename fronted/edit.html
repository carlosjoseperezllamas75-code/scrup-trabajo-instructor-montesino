<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="app.js"></script>
    <title>Gestor de Contraseñas - Editar</title>
</head>
<body style="background-color: rgb(172, 187, 210);">
    <div id="main" class="container">
        <div id="marco" class="container my-5 text-center">
            <h2>Gestor de contraseñas - Editar</h2>
            <div class="form-group my-3">
                <label for="plataforma">Plataforma:</label>
                <input type="text" class="form-control" id="plataforma" placeholder="Plataforma">
            </div>
            <div class="form-group my-3">
                <label for="usuario">Usuario:</label>
                <input type="text" class="form-control" id="usuario" placeholder="Usuario">
            </div>
            <div class="form-group my-3">
                <label for="clave">Clave:</label>
                <input type="password" class="form-control" id="clave" placeholder="Clave">
            </div>
            <div class="tarjeta">
                <button type="button" id="btn-guardar" class="btn btn-info me-2">Guardar</button>
                <button type="button" class="btn btn-warning" onclick="location.href='index.html'">Regresar</button>
            </div>
        </div>
    </div>

    <script>
        function getParameterByName(name) {
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
            var results = regex.exec(location.search);
            return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        var id_registro = getParameterByName('variable1');
        if (id_registro) {
            consulta_individual(id_registro);
            document.getElementById('btn-guardar').onclick = function() {
                modificar(id_registro);
            };
        }
    </script>
</body>
</html>
